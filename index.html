<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For My Cosmic Bestie 🌌</title>

<style>
/* RESET */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* SPACE BACKGROUND */
body {
  height: 100vh;
  background: radial-gradient(circle at bottom, #05001a, #000000);
  overflow: hidden;
  font-family: 'Segoe UI', sans-serif;
  color: white;
}

/* STARS */
.stars {
  width: 100%;
  height: 100%;
  position: absolute;
  background: transparent;
}

.stars::after {
  content: "";
  position: absolute;
  width: 200%;
  height: 200%;
  background-image: radial-gradient(1px 1px at 20px 30px, white, transparent),
                    radial-gradient(1px 1px at 100px 150px, white, transparent),
                    radial-gradient(1px 1px at 200px 80px, white, transparent),
                    radial-gradient(1px 1px at 300px 200px, white, transparent);
  animation: moveStars 60s linear infinite;
}

@keyframes moveStars {
  from { transform: translateY(0); }
  to { transform: translateY(-500px); }
}

/* CENTER CONTENT */
.container {
  position: relative;
  z-index: 2;
  text-align: center;
  top: 50%;
  transform: translateY(-50%);
  padding: 20px;
}

  font-size: 3em;
  text-shadow: 0 0 20px #7f5cff;
}
